# Δημοσίευση του site στο GitHub Pages σε κάθε push στο main (ή χειροκίνητα από το Actions → Run workflow).
#
# Μία φορά, στο GitHub: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Προαιρετικές μεταβλητές (Settings → Secrets and variables → Actions → Variables):
#   PUBLISH_SLIDES = true   τα PDF των διαλέξεων μπαίνουν στο site (μόνο με άδεια του διδάσκοντα)
#   BASE_PATH      = /      όταν το site αποκτήσει δικό του domain (π.χ. subdomain της σχολής)
# Το 3D μοντέλο δεν χτίζεται εδώ: ανεβαίνει όπως είναι στο repo (public/models/spot.glb, από το npm run glb).
name: Δημοσίευση στο GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # project site: https://<χρήστης>.github.io/<repo>/
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
          VITE_PUBLISH_SLIDES: ${{ vars.PUBLISH_SLIDES }}

      # Το GitHub Pages δεν ξέρει τις διαδρομές του site (π.χ. /projects/spot): για άγνωστη διαδρομή
      # σερβίρει το 404.html, που εδώ είναι το ίδιο το site και ανοίγει τη σωστή σελίδα.
      - name: Fallback για εσωτερικές σελίδες
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
